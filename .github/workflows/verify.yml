name: Manual verification
on:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build:functions
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: cp android/app/google-services.example.json android/app/google-services.json
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: android
        run: bash gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
